services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./events:/app/events
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    environment:
      - DB_PATH=/app/events/events.db
      - STORE_ID=ST1008
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    volumes:
      - ./events:/app/events
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    environment:
      - DB_PATH=/app/events/events.db
      - STORE_ID=ST1008
    command: ["python", "-m", "pipeline.run", "--clips-dir", "data"]
    profiles:
      - pipeline

  dashboard:
    build: .
    volumes:
      - ./events:/app/events
    environment:
      - DB_PATH=/app/events/events.db
    # Waits for the API to be healthy, then streams events live
    depends_on:
      api:
        condition: service_healthy
    command:
      - python
      - dashboard.py
      - --api
      - http://api:8000
      - --speed
      - "50"
    stdin_open: true
    tty: true
    profiles:
      - dashboard
